<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль разработчика</title>
    <style>
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.2); max-width: 300px; margin: 50px auto; text-align: center; font-family: sans-serif; border-radius: 10px; padding: 20px; background: #fff; }
        .btn { border: none; outline: 0; padding: 12px; color: white; background-color: #007acc; text-align: center; width: 100%; border-radius: 5px; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body style="background-color: #f3f4f6;">
    <div class="card">
        <h2>Даниил</h2>
        <p style="color: grey;">Студент / Разработчик</p>
        <p>Изучаю Git, GitHub и работу с ветками в VS Code.</p>
        <button class="btn">Связаться</button>
    </div>
</body>
</html>
